[project]
name = "muscpy"
version = "0.6.8"
description = "discord bot for use youtube-audio-stream"
authors = [
    { name = "mal1kc" }
]
dependencies = [
    "yt-dlp>=2026.10.26",
    "discord-py[voice]>=2.7.1",
]
readme = "readme.md"
requires-python = ">= 3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.4",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/muscpy"]

